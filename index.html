
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>J.A.R.V.I.S</h1>
    <p class="subtitle">PERSONAL AI ASSISTANT</p>

    <div class="circle" id="circle">
      <div class="inner-circle">J</div>
    </div>

    <h2 id="status">SYSTEM ONLINE</h2>
    <p id="output">Hello! I am JARVIS. How can I help you?</p>

    <button id="micButton">🎙 START LISTENING</button>

    <div class="buttons">
      <button onclick="tellTime()">🕒 TIME</button>
      <button onclick="checkBattery()">🔋 BATTERY</button>
      <button onclick="openYouTube()">▶ YOUTUBE</button>
    </div>

    <p class="footer">JARVIS AI • VERSION 1.0</p>
  </div>

  <script src="script.js"></script>
</body>
